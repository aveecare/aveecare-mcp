name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Example configs parse and hold no real key
        run: python scripts/check_configs.py
      - name: Markdown links resolve
        run: npx --yes markdown-link-check@3 --quiet --config .github/markdown-link-check.json README.md docs/*.md
